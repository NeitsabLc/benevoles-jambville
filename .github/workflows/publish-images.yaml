name: Publication des images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publication-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier-candidat:
    name: Publier le candidat ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: php
            file: docker/php/Dockerfile
            target: php-production
          - image: nginx
            file: docker/php/Dockerfile
            target: nginx-production
          - image: postgres
            file: docker/postgres/Dockerfile
            target: postgres-runtime
          - image: liquibase
            file: docker/liquibase/Dockerfile
            target: liquibase-runtime
          - image: backup
            file: docker/postgres/Dockerfile
            target: backup-runtime

    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir le nom et l'etiquette immuable
        shell: bash
        run: |
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY_IMAGE=ghcr.io/${proprietaire}/benevole-jambville-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Se connecter a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Construire et publier le candidat avec SBOM et provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publication-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=publication-${{ matrix.image }}

      - name: Valider le digest construit
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'

      - name: Signer le candidat avec Sigstore
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"

      - name: Afficher la reference immuable
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"

  tester-candidats:
    name: Tester les images candidates
    if: github.ref == 'refs/heads/main'
    needs: publier-candidat
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Se connecter a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resoudre les cinq digests candidats
        shell: bash
        run: |
          . ./scripts/registry-helpers.sh
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          for image in $(release_image_names); do
            depot="ghcr.io/${proprietaire}/benevole-jambville-${image}"
            candidat="${depot}:sha-${GITHUB_SHA}"
            digest=$(registry_resolve_digest_with_retry "$candidat")
            variable="BENEVOLE_RELEASE_${image^^}_IMAGE"
            echo "${variable}=${depot}@${digest}" >> "$GITHUB_ENV"
          done
          echo "BENEVOLE_RELEASE_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Verifier les signatures Sigstore
        run: ./scripts/verify-release-images.sh

      - name: Preparer la configuration isolee
        run: ./scripts/ci-prepare-env.sh

      - name: Tester exactement les images candidates
        env:
          COMPOSE_PROJECT_NAME: benevole-jambville-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          NGINX_HOST_PORT: 18083
          POSTGRES_HOST_PORT: 15437
          USE_RELEASE_IMAGES: "1"
        run: |
          export SMOKE_BACKUP_IMAGE="$BENEVOLE_RELEASE_BACKUP_IMAGE"
          export SMOKE_POSTGRES_IMAGE="$BENEVOLE_RELEASE_POSTGRES_IMAGE"
          ./scripts/ci-production-smoke.sh

  valider-tag:
    name: Valider la version a promouvoir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Recuperer l'historique Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verifier le tag et son appartenance a main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Le tag doit respecter vMAJEUR.MINEUR.CORRECTIF." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          objet_tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          if [ "$(jq -r '.object.type' <<<"$objet_tag")" != "tag" ]; then
            echo "Le tag de release doit etre annote et signe." >&2
            exit 1
          fi
          signature_valide=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/$(jq -r '.object.sha' <<<"$objet_tag")" \
            --jq '.verification.verified')
          if [ "$signature_valide" != "true" ]; then
            echo "La signature du tag de release n'est pas validee par GitHub." >&2
            exit 1
          fi

      - name: Attendre la validation des images candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for tentative in $(seq 1 54); do
            etat=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-images.yaml/runs" \
              -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -f per_page=10 \
              --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "absent" elif .status != "completed" then .status else .conclusion end') || etat=indisponible
            case "$etat" in
              success) exit 0 ;;
              absent|indisponible|queued|in_progress|pending|requested|waiting)
                [ "$tentative" -eq 54 ] || sleep 10 ;;
              *) echo "La publication candidate a termine avec l'etat ${etat}." >&2; exit 1 ;;
            esac
          done
          echo "Validation candidate indisponible apres 9 minutes pour ${GITHUB_SHA}." >&2
          exit 1

  promouvoir-version:
    name: Promouvoir ${{ matrix.image }} sans reconstruire
    if: startsWith(github.ref, 'refs/tags/v')
    needs: valider-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image:
          - php
          - nginx
          - postgres
          - liquibase
          - backup

    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir les references
        shell: bash
        run: |
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "REGISTRY_IMAGE=ghcr.io/${proprietaire}/benevole-jambville-${{ matrix.image }}"
            echo "CANDIDATE_TAG=sha-${GITHUB_SHA}"
            echo "VERSION=${version}"
          } >> "$GITHUB_ENV"

      - name: Se connecter a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Promouvoir exactement le digest candidat
        shell: bash
        run: |
          inspecter_digest() {
            reference=$1
            for tentative in 1 2 3 4 5 6; do
              digest_inspecte=$(docker buildx imagetools inspect "$reference" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }') || true
              if printf '%s\n' "$digest_inspecte" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                printf '%s\n' "$digest_inspecte"
                return 0
              fi
              echo "Image pas encore disponible (${tentative}/6) : ${reference}" >&2
              sleep 10
            done
            return 1
          }

          candidat="${REGISTRY_IMAGE}:${CANDIDATE_TAG}"
          if ! digest=$(inspecter_digest "$candidat"); then
            echo "Image candidate absente ou digest invalide : ${candidat}" >&2
            exit 1
          fi

          reference_promue="${REGISTRY_IMAGE}:${VERSION}"
          digest_promu=$(docker buildx imagetools inspect "$reference_promue" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }') || digest_promu=""
          if [ "$digest_promu" = "$digest" ]; then
            echo "${reference_promue} pointe deja sur ${digest}"
            exit 0
          fi

          source_immuable="${REGISTRY_IMAGE}@${digest}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$reference_promue" \
            "$source_immuable"

          if ! digest_promu=$(inspecter_digest "$reference_promue"); then
            echo "Image promue inaccessible : ${reference_promue}" >&2
            exit 1
          fi
          if [ "$digest_promu" != "$digest" ]; then
            echo "Digest promu incorrect pour ${reference_promue}: ${digest_promu} (attendu : ${digest})" >&2
            exit 1
          fi

          echo "${REGISTRY_IMAGE}:${VERSION} -> ${digest}"
