services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php-development
      args:
        PHP_VERSION: "${PHP_VERSION}"
        PHP_IMAGE_DIGEST: "${PHP_IMAGE_DIGEST:-sha256:9467f10bf42897dec0abb73ee20c747ebd45463ec9d6fcc4044cb83eba6dade7}"
        COMPOSER_IMAGE_DIGEST: "${COMPOSER_IMAGE_DIGEST:-sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040}"
        NGINX_IMAGE_DIGEST: "${NGINX_IMAGE_DIGEST:-sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}"
    working_dir: /var/www/app
    environment:
      DATABASE_HOST: database
      DATABASE_NAME: "${POSTGRES_DB}"
      DATABASE_TEST_NAME: "${POSTGRES_DB}_test"
      DATABASE_USER: benevole_jambville_app
      DATABASE_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD doit être défini}"
      TRUSTED_HOST_PATTERN: "${TRUSTED_HOST_PATTERN:-^(localhost|127[.]0[.]0[.]1)$}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1}"
    volumes:
      - ./app:/var/www/app
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]

  nginx:
    image: "nginx:${NGINX_VERSION}@${NGINX_IMAGE_DIGEST:-sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46}"
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HOST_PORT:-8081}:8080"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks: [benevole_jambville]

  database:
    image: "benevole-jambville-postgres:${POSTGRES_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      target: postgres-runtime
      args:
        POSTGRES_VERSION: "${POSTGRES_VERSION}"
        POSTGRES_IMAGE_DIGEST: "${POSTGRES_IMAGE_DIGEST:-sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}"
      POSTGRES_APP_USER: "benevole_jambville_app"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD doit être défini}"
      POSTGRES_MIGRATOR_USER: "benevole_jambville_migrator"
      POSTGRES_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD doit être défini}"
      POSTGRES_BACKUP_USER: "benevole_jambville_backup"
      POSTGRES_BACKUP_PASSWORD: "${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD doit être défini}"
      POSTGRES_HEALTHCHECK_USER: "${POSTGRES_HEALTHCHECK_USER:-benevole_jambville_admin}"
      POSTGRES_HEALTHCHECK_PASSWORD: "${POSTGRES_HEALTHCHECK_PASSWORD:?POSTGRES_HEALTHCHECK_PASSWORD doit être défini}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - donnees_postgresql:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./docker/postgres/sync-role-passwords.sh:/usr/local/bin/sync-role-passwords:ro
      - ./docker/postgres/finalize-role-hardening.sh:/usr/local/bin/finalize-role-hardening:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_HEALTHCHECK_PASSWORD}"
          psql --host=127.0.0.1
          --username="$${POSTGRES_HEALTHCHECK_USER}"
          --dbname="$${POSTGRES_DB}"
          --tuples-only --no-align
          --command='SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [benevole_jambville]

  liquibase:
    image: "benevole-jambville-liquibase:${LIQUIBASE_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
      target: liquibase-runtime
      args:
        LIQUIBASE_VERSION: "${LIQUIBASE_VERSION}"
        LIQUIBASE_IMAGE_DIGEST: "${LIQUIBASE_IMAGE_DIGEST:-sha256:ec5b6ef176df3b39d69a67af728dbe0baa39ccae42da94e0ca397ef0dfe9cedb}"
        PGJDBC_VERSION: "${PGJDBC_VERSION:-42.7.12}"
        PGJDBC_SHA256: "${PGJDBC_SHA256:-31fbf6f06b2217fb51d5100cee51b22625cc81640da0679b47914e54c1e6377c}"
    profiles: [outils]
    working_dir: /liquibase/changelog
    volumes:
      - ./database/changelog:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: "jdbc:postgresql://database:5432/${POSTGRES_DB}"
      LIQUIBASE_COMMAND_USERNAME: "${POSTGRES_USER}"
      LIQUIBASE_COMMAND_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}"
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: public
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]

volumes:
  donnees_postgresql:

networks:
  benevole_jambville:
