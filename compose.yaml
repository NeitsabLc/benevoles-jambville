services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION}"
    working_dir: /var/www/app
    environment:
      DATABASE_HOST: database
      DATABASE_NAME: "${POSTGRES_DB}"
      DATABASE_TEST_NAME: "${POSTGRES_DB}_test"
      DATABASE_USER: benevole_jambville_app
      DATABASE_PASSWORD: "${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}"
    volumes:
      - ./app:/var/www/app
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]

  nginx:
    image: "nginx:${NGINX_VERSION}"
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    networks: [benevole_jambville]

  database:
    image: "postgres:${POSTGRES_VERSION}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_APP_USER: "benevole_jambville_app"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}"
      POSTGRES_BACKUP_USER: "benevole_jambville_backup"
      POSTGRES_BACKUP_PASSWORD: "${POSTGRES_BACKUP_PASSWORD:-${POSTGRES_PASSWORD}}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - donnees_postgresql:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ./docker/postgres/finalize-role-hardening.sh:/usr/local/bin/finalize-role-hardening:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [benevole_jambville]

  liquibase:
    image: "liquibase:${LIQUIBASE_VERSION}"
    profiles: [outils]
    working_dir: /liquibase/changelog
    volumes:
      - ./database/changelog:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: "jdbc:postgresql://database:5432/${POSTGRES_DB}"
      LIQUIBASE_COMMAND_USERNAME: "${POSTGRES_USER}"
      LIQUIBASE_COMMAND_PASSWORD: "${POSTGRES_PASSWORD}"
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db.changelog-master.yaml
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: public
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]

volumes:
  donnees_postgresql:

networks:
  benevole_jambville:
