databaseChangeLog:
  - includeAll:
      path: versioned
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: true

  - includeAll:
      path: repeatable
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false

  - includeAll:
      path: dev
      relativeToChangelogFile: true
      errorIfMissingOrEmpty: false
      contextFilter: "@dev"

