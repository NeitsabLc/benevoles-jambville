date.timezone = Europe/Paris
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
html_errors = Off
zend.exception_ignore_args = On
opcache.enable = 1
opcache.validate_timestamps = 1
