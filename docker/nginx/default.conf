map $request_uri $journal_request_uri {
    default $request_uri;
    ~^/premiere-connexion/ /premiere-connexion/[JETON_MASQUE];
}

map $http_referer $journal_referer {
    default $http_referer;
    ~^https?://[^/]+/premiere-connexion/ [JETON_MASQUE];
}

map $request_uri $politique_referent {
    default "same-origin";
    ~^/premiere-connexion/ "no-referrer";
}

map $request_uri $cache_activation {
    default "";
    ~^/premiere-connexion/ "no-store";
}

log_format journal_securise '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $journal_request_uri $server_protocol" '
                             '$status $body_bytes_sent "$journal_referer" '
                             '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    fastcgi_hide_header X-Powered-By;
    access_log /var/log/nginx/access.log journal_securise;
    root /var/www/app/public;
    index index.php;

    add_header Referrer-Policy $politique_referent always;
    add_header Cache-Control $cache_activation always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self' 'nonce-$request_id' https://ga.jspm.io; style-src 'self'" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param CSP_NONCE $request_id;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
