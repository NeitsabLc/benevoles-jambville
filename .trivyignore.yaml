vulnerabilities:
  # Alpine associe ces CVE de commandes util-linux a tous ses sous-paquets.
  # Les images Alpine ne contiennent que libuuid ; mount et nsenter y sont
  # fournis par BusyBox. L'expiration force une nouvelle verification lorsque
  # le paquet Alpine corrige sera disponible sur tous les runners.
  - id: CVE-2026-53612
    statement: Le binaire mount de util-linux n'est pas present dans les images.
    expired_at: 2026-09-19
