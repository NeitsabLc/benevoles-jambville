doctrine:
    dbal:
        driver: pdo_pgsql
        host: '%env(DATABASE_HOST)%'
        port: 5432
        dbname: '%env(DATABASE_NAME)%'
        user: '%env(DATABASE_USER)%'
        password: '%env(DATABASE_PASSWORD)%'
        server_version: '18'
        charset: utf8
        schema_filter: '~^(?!public\.)~'
        types:
            datetimetz_immutable: App\Doctrine\Type\PostgreSqlDateTimeTzImmutableType
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            dbname: '%env(DATABASE_TEST_NAME)%'
