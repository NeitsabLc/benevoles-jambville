x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  php:
    logging: *production-logging
    image: "benevole-jambville-php-production:${APP_IMAGE_TAG:-local}"
    pull_policy: build
    build:
      target: php-production
    env_file:
      - path: ./app/.env
        required: true
      - path: ./app/.env.local
        required: false
    restart: unless-stopped
    read_only: true
    user: www-data
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes: !override []
    tmpfs:
      - /tmp:mode=1777
      - /var/www/app/var/cache:mode=0770,uid=33,gid=33
      - /var/www/app/var/log:mode=0770,uid=33,gid=33
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - 'exit(false === @fsockopen("127.0.0.1", 9000) ? 1 : 0);'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  maintenance:
    logging: *production-logging
    restart: unless-stopped
    image: "benevole-jambville-php-production:${APP_IMAGE_TAG:-local}"
    pull_policy: build
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php-production
      args:
        PHP_VERSION: "${PHP_VERSION}"
        PHP_IMAGE_DIGEST: "${PHP_IMAGE_DIGEST:-sha256:9467f10bf42897dec0abb73ee20c747ebd45463ec9d6fcc4044cb83eba6dade7}"
        COMPOSER_IMAGE_DIGEST: "${COMPOSER_IMAGE_DIGEST:-sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040}"
        NGINX_IMAGE_DIGEST: "${NGINX_IMAGE_DIGEST:-sha256:77da26c31397bf6694b4bf93275f5b40b0b120ba1b8f114264b603e592c561d6}"
    working_dir: /var/www/app
    entrypoint: ["benevole-jambville-maintenance"]
    env_file:
      - path: ./app/.env
        required: true
      - path: ./app/.env.local
        required: false
    read_only: true
    user: www-data
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /var/www/app/var/cache:mode=0770,uid=33,gid=33
      - /var/www/app/var/log:mode=0770,uid=33,gid=33
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_HOST: database
      DATABASE_NAME: "${POSTGRES_DB}"
      DATABASE_USER: benevole_jambville_app
      DATABASE_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD doit être défini}"
      TRUSTED_HOST_PATTERN: "${TRUSTED_HOST_PATTERN:-^(localhost|127[.]0[.]0[.]1)$}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1}"
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]

  nginx:
    logging: *production-logging
    image: "benevole-jambville-nginx-production:${APP_IMAGE_TAG:-local}"
    pull_policy: build
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx-production
      args:
        PHP_VERSION: "${PHP_VERSION}"
        NGINX_VERSION: "${NGINX_VERSION}"
        PHP_IMAGE_DIGEST: "${PHP_IMAGE_DIGEST:-sha256:9467f10bf42897dec0abb73ee20c747ebd45463ec9d6fcc4044cb83eba6dade7}"
        COMPOSER_IMAGE_DIGEST: "${COMPOSER_IMAGE_DIGEST:-sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040}"
        NGINX_IMAGE_DIGEST: "${NGINX_IMAGE_DIGEST:-sha256:77da26c31397bf6694b4bf93275f5b40b0b120ba1b8f114264b603e592c561d6}"
    restart: unless-stopped
    read_only: true
    user: nginx
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes: !override []
    tmpfs:
      - /var/cache/nginx:mode=0750,uid=101,gid=101
      - /var/log/nginx:mode=0750,uid=101,gid=101
      - /var/run:mode=0750,uid=101,gid=101
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    ports: !override
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HOST_PORT:-8081}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --output-document=/dev/null
          --header='Host: ${APP_HOSTNAME:-localhost}'
          http://127.0.0.1:8080/connexion
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      php:
        condition: service_healthy

  database:
    logging: *production-logging
    restart: unless-stopped
    init: true
    user: postgres
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=0775,uid=70,gid=70
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    environment:
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}"
      POSTGRES_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD doit être défini}"
      POSTGRES_HEALTHCHECK_USER: "${POSTGRES_HEALTHCHECK_USER:-benevole_jambville_admin}"
      POSTGRES_HEALTHCHECK_PASSWORD: "${POSTGRES_HEALTHCHECK_PASSWORD:?POSTGRES_HEALTHCHECK_PASSWORD doit être défini}"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes: !override
      - donnees_postgresql:/var/lib/postgresql
      - "${POSTGRES_HBA_FILE:-./docker/postgres/pg_hba.prod.conf.example}:/etc/postgresql/pg_hba.conf:ro"

  backup:
    logging: *production-logging
    restart: unless-stopped
    image: "benevole-jambville-backup:${BACKUP_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      target: backup-runtime
      args:
        POSTGRES_VERSION: "${POSTGRES_VERSION}"
        POSTGRES_IMAGE_DIGEST: "${POSTGRES_IMAGE_DIGEST:-sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}"
        AGE_PACKAGE_VERSION: "${AGE_PACKAGE_VERSION:-1.3.1-r6}"
    user: postgres
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: benevole_jambville_backup
      PGPASSWORD: "${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD doit être défini}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT doit être défini}"
    volumes:
      - "${BACKUP_DIR:-./var/backups}:/backups"
    tmpfs:
      - /tmp:mode=1777
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]

  liquibase:
    logging: *production-logging
    init: true
    user: liquibase:liquibase
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      LIQUIBASE_COMMAND_USERNAME: benevole_jambville_migrator
      LIQUIBASE_COMMAND_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD doit être défini}"

networks:
  benevole_jambville:
    ipam:
      config:
        - subnet: "${BENEVOLE_NETWORK_SUBNET:-172.29.0.0/24}"
