services:
  php:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"

  maintenance:
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION}"
    working_dir: /var/www/app
    entrypoint: ["benevole-jambville-maintenance"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      DATABASE_HOST: database
      DATABASE_NAME: "${POSTGRES_DB}"
      DATABASE_USER: benevole_jambville_app
      DATABASE_PASSWORD: "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD doit être défini}"
    volumes:
      - ./app:/var/www/app
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]

  nginx:
    restart: unless-stopped

  database:
    restart: unless-stopped

  backup:
    restart: unless-stopped
    image: "postgres:${POSTGRES_VERSION}"
    entrypoint: ["/bin/sh", "/usr/local/bin/benevole-jambville-backup"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "benevole_jambville_backup"
      PGPASSWORD: "${POSTGRES_BACKUP_PASSWORD:?POSTGRES_BACKUP_PASSWORD doit être défini}"
    volumes:
      - ./docker/postgres/backup.sh:/usr/local/bin/benevole-jambville-backup:ro
      - "${BACKUP_DIR:-./var/backups}:/backups"
    depends_on:
      database:
        condition: service_healthy
    networks: [benevole_jambville]
